<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PawsOff</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <main class="popup">
    <header class="header">
      <img src="icons/icon128.png" alt="" class="logo" />
      <h1>PawsOff</h1>
      <label class="switch">
        <input id="enabled" type="checkbox" />
        <span></span>
      </label>
    </header>

    <!-- Timer row -->
    <div class="timer-row">
      <label class="timer-field">
        <span class="timer-label">⏱ Puppy appears after</span>
        <select id="usage-limit">
          <option value="1">1 min</option>
          <option value="2" selected>2 mins</option>
          <option value="5">5 mins</option>
          <option value="10">10 mins</option>
          <option value="15">15 mins</option>
          <option value="20">20 mins</option>
          <option value="30">30 mins</option>
          <option value="45">45 mins</option>
          <option value="60">60 mins</option>
        </select>
      </label>
      <label class="timer-field">
        <span class="timer-label">🐾 Puppy stays for</span>
        <select id="break-time">
          <option value="1">1 min</option>
          <option value="2" selected>2 mins</option>
          <option value="5">5 mins</option>
          <option value="10">10 mins</option>
        </select>
      </label>
    </div>

    <!-- Target sites -->
    <section class="section">
      <div class="section-header">
        <span class="section-title">🌐 Guarded Sites</span>
        <span class="info-icon"
          title="Check the sites you want PawsOff to guard. When you spend too long on them, the puppy takes over.">ⓘ</span>
      </div>
      <div class="site-grid" id="site-grid">
        <!-- populated by JS -->
      </div>

      <label class="check other-sites-check">
        <input id="other-sites-toggle" type="checkbox" />
        <span>Other sites</span>
        <span class="help-inline">comma separated</span>
      </label>
      <textarea id="other-sites" class="other-textarea" spellcheck="false"
        placeholder="example.com, news.com, sports.com" style="display:none;"></textarea>
    </section>

    <!-- Usage -->
    <section class="section usage-section">
      <p id="usage-info" class="usage-text">Time shows up here while you are on a target site.</p>
    </section>

    <!-- Actions -->
    <button id="shoo-btn" type="button" class="shoo-btn" disabled>Shhh, puppy! 🐾</button>
    <button id="save" type="button" class="save-btn">Save settings</button>

    <footer class="footer">
      <div style="display: flex; gap: 16px;">
        <a class="footer-link" href="https://kapilraghuwanshi.github.io/paws-off-screen-gatekeeper/index.html"
          target="_blank">Our Website ↗</a>
        <a class="footer-link" href="https://chromewebstore.google.com/detail/pawsoff/fndochdepjhdgjncaaenejjikecennlk"
          target="_blank">Chrome Web Store ↗</a>
      </div>
      <div class="footer-social">
        <a href="https://www.youtube.com/@TechMonkKapil" target="_blank" rel="noopener" title="YouTube">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.42a2.78 2.78 0 0 0-1.94 2C1 8.17 1 12 1 12s0 3.83.46 5.58a2.78 2.78 0 0 0 1.94 2C5.12 20 12 20 12 20s6.88 0 8.6-.42a2.78 2.78 0 0 0 1.94-2C23 15.83 23 12 23 12s0-3.83-.46-5.58z">
            </path>
            <polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"></polygon>

            <rect x="2" y="9" width="4" height="12"></rect>
